  <meta name="description" content="UE5.6でエディタでは表示される影が、Quest3S（VRプレビュー）では表示されない問題の解決方法。">
  <link rel="canonical" href="https://roy00227.github.io/memo/ue/2025/0811-vr-none-shadow/">

<body>
  <div id="header"></div>

  <main class="container">
    <h1>2025/08/11-UE5.6-問題：VRプレビューで影が表示されない</h1>

    <section>
      <h2>問題</h2>
      <p>
        エディタのビューポートでは表示される影が、Quest3Sだと表示されない。
      </p>
    </section>

    <section>
      <h2>解決</h2>
      <div class="image-container">
        <img src="image.png" alt="image">
        <div class="text">
          プロジェクト設定でエンジン-レンダリングのモバイルセクションにある「可動SpotlightShadowsをサポート」のチェックボックスをTrueにする。
        </div>
      </div>
    </section>
              
  </main>

  <div id="footer"></div>
</body>
